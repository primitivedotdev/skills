name: Skill checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix skills/primitive-connect --ignore-scripts
      - run: npm test --prefix skills/primitive-connect
